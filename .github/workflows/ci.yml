name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: orders
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=order-service/prisma/schema.prisma

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:1234@localhost:5432/orders?schema=public
        run: npx prisma migrate deploy --schema=order-service/prisma/schema.prisma

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:1234@localhost:5432/orders?schema=public
          REDIS_URL: redis://localhost:6379
        run: npm run test --workspace=order-service
